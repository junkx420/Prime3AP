# Example player settings for Metroid Prime 3: Corruption (Prime3AP).
# Copy this file into the "Players" folder of your Archipelago installation (or give it to the host of the
# multiworld), change "name", and generate. All values below are the defaults.
# Full template with every option explained: Archipelago Launcher -> "Generate Template Options".

name: YourName                # slot name, max. 16 characters; must be unique in the multiworld
description: 'Metroid Prime 3: Corruption, default options'
game: 'Metroid Prime 3: Corruption'
requires:
  version: 0.6.8              # Archipelago version
  game:
    'Metroid Prime 3: Corruption': 0.4.0   # world version (metroidprime3.apworld)

'Metroid Prime 3: Corruption':
  # Keep any subset of these four items. Power Beam, Combat Visor and Scan Visor are always kept.
  # Tricks are experimental. Even beginner can require tricks for progression.
  # Player options: https://github.com/junkx420/corruptovania/blob/archipelago/docs/AP_OPTIONS.md
  starting_items: ['Charge Beam', 'Space Jump Boots', 'Morph Ball', 'Morph Ball Bombs']
  trick_level: 'off'
  trick_overrides: {}
  progression_balancing: normal   # 0-99, "normal" = 50
  accessibility: full             # full: every location reachable; minimal: only the goal
  local_items: []
  non_local_items: []
  start_inventory: {}
  start_hints: []
  start_location_hints: []
  exclude_locations: []
  priority_locations: []
  item_links: []
  plando_items: []
